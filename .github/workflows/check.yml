name: check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install check tools
        run: python -m pip install --quiet pyyaml
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Contract files parse
        run: python -c "import yaml; yaml.safe_load(open('docs/tasarim/openapi.yaml'))"
