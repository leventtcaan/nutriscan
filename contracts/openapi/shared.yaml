# Components every module reuses. Referenced as ./shared.yaml#/components/... (from modules/: ../shared.yaml).
# Changing anything here affects every consumer: contract-change label, provider and consumer approval.
components:
  schemas:
    Verdict:
      type: string
      description: >-
        Outcome of checking an item against a household member's constraints. Exactly four values;
        there is deliberately no "safe" value. Missing, stale, conflicting or unrecognised data
        yields COULD_NOT_VERIFY, never a more permissive value. Serialized by name, never by ordinal.
      enum:
        - NOT_SUITABLE
        - CAUTION
        - NO_CONFLICT_FOUND
        - COULD_NOT_VERIFY

    Problem:
      type: object
      description: >-
        Error body, RFC 9457 Problem Details (media type application/problem+json).
        Extension members may be added by the operation that returns it.
      required: [title, status]
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
          description: Identifies the problem type. Absent means "about:blank" (RFC 9457 §3.1.1), which is how the server omits it.
        title:
          type: string
          description: Short summary of the problem type.
        status:
          type: integer
          format: int32
          minimum: 400
          maximum: 599
          description: HTTP status code, repeated for convenience.
        detail:
          type: string
          description: Explanation specific to this occurrence.
        instance:
          type: string
          format: uri-reference
          description: Identifies this occurrence, usually the request path.

    PageMetadata:
      type: object
      description: >-
        Position of a page in a paged list. A paged response is an object with "content" (array of
        the item schema) and "page" (this schema).
      additionalProperties: false
      required: [size, number, totalElements, totalPages]
      properties:
        size:
          type: integer
          format: int32
          minimum: 1
          description: Requested page size.
        number:
          type: integer
          format: int32
          minimum: 0
          description: Zero-based page index.
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          format: int32
          minimum: 0

  parameters:
    PageNumber:
      name: page
      in: query
      required: false
      description: Zero-based page index.
      schema:
        type: integer
        format: int32
        minimum: 0
    PageSize:
      name: size
      in: query
      required: false
      description: Items per page. Default and upper bound are server configuration, not part of the contract.
      schema:
        type: integer
        format: int32
        minimum: 1

  responses:
    BadRequest:
      description: The request is malformed or fails validation.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: The resource does not exist or is not visible to the caller.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ServerError:
      description: Unexpected server error.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
