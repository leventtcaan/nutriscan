  - tools/board-sync/
  kabul:
  - '`<modül>/AB<no>-…` dalı push edilince PBI Committed; üst Feature ve Epic New ise In Progress (iş öğesi geçmişinde görünür)'
  - Bir Feature'ın son PBI'ı Done olunca Feature Done
  - AZURE_BOARDS_PAT secret'ı yokken iş akışı yeşil biter ve PR'a board aksiyon listesi (bağlantılı) yorum olarak düşer
  - Org, proje ve takım adı kodda yok (repo değişkenleri); PAT hiçbir log satırında görünmüyor
  komutlar:
  - act ya da test dalında gerçek koşu (sonuç PR'da ekran görüntüsüyle)
